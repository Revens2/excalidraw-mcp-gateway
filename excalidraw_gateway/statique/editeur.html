<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excalidraw</title>
<!--
  Editeur principal integre de l'instance Excalidraw auto-hebergee.

  Versionne dans Revens2/excalidraw-mcp-gateway
  (excalidraw_gateway/statique/editeur.html), servi par la passerelle
  UNIQUEMENT sur le reseau prive (vhost nginx excalidraw-prive sur
  l'interface NetBird, jamais en public). Aucune page editeur,
  bibliotheque ou API fichiers n'est routee en public : seul
  /excalidraw/mcp (+ OAuth/well-known) reste public pour ChatGPT.

  Diagnostic rendu (2026-09-16) : la version precedente n'affichait
  qu'une interface brute (icones geantes, layout casse) car la feuille
  de style officielle du composant n'etait JAMAIS chargee (161 requetes
  JS esm.sh, 0 stylesheet). Correctif : <link> vers
  dist/prod/index.css, meme version epinglee (0.18.0), meme CDN que le
  JS (aucune fragilite ajoutee : sans esm.sh la page est deja en repli
  JSON). Aucun CSS artisanal pour le canvas lui-meme.

  Auth : AUCUN secret cote navigateur (ni champ de saisie, ni stockage
  local, ni en-tete d'authentification). Le proxy du vhost prive injecte
  cote serveur l'identifiant avant de relayer vers 127.0.0.1:8123. La passerelle
  garde l'exigence du Bearer (fail-closed) : en direct sans proxy,
  l'API repond 401.

  Actions bibliotheque discretes : boutons compacts integres au canvas
  officiel via renderTopRightUI (meme pattern que l'app upstream),
  ouvrant la modale file-browser (ile Excalidraw sur overlay).
  Canvas plein ecran ; puce de statut discrete en bas a gauche.
  Fichiers locaux (ouvrir/enregistrer) : menu natif Excalidraw.
-->
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css"
  integrity="sha384-P2m2pozVIvqraZqVzVN3xTtfbe013MLWklwuLToXT3r+H03GIi1MtrjING9vCLlg" crossorigin="anonymous">
<style>
:root { color-scheme: light; --violet: #6965db; --fond-selection: #dbe4ff; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
#scene { position: fixed; inset: 0; }
#scene .excalidraw-wrapper { height: 100%; }
/* --- Actions bibliotheque discretes (renderTopRightUI) --- */
.biblio-groupe { display: flex; gap: 6px; align-items: center; }
.biblio-btn { display: flex; align-items: center; background: #fff; color: #1e1e2e;
  border: 1px solid #e0e0ea; border-radius: 8px; padding: 6px 10px;
  font-size: 0.8rem; font-weight: 600; line-height: 1.2; }
.biblio-btn:hover { background: #f4f4fa; }
.biblio-btn-primaire { background: var(--violet); border-color: var(--violet); color: #fff; }
.biblio-btn-primaire:hover { background: #5753c9; }
/* --- Puce de statut discrete --- */
#puce { position: fixed; left: 12px; bottom: 12px; z-index: 40;
  background: rgba(255,255,255,.94); color: #555; border: 1px solid #e0e0ea;
  border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; max-width: 42vw;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.08); pointer-events: none; }
/* --- Repli JSON (CDN injoignable) --- */
#repli { display: none; position: fixed; inset: 0; box-sizing: border-box; padding: 16px;
  flex-direction: column; gap: 8px; background: #fff; z-index: 30; }
#repli textarea { flex: 1; font-family: monospace; }
/* --- Modale file-browser (ile Excalidraw sur overlay) --- */
.voile { position: fixed; inset: 0; background: rgba(30, 30, 46, 0.45); display: flex;
  align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.voile[hidden] { display: none; }
.ile { background: #fff; color: #1e1e2e; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  width: min(640px, 100%); max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid #e0e0ea; font-size: 0.95rem; }
.modale-entete { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid #eee; }
.modale-entete h2 { font-size: 1rem; margin: 0; flex: 1; }
.modale-actions-entete { display: flex; gap: 6px; }
.modale-actions-entete button { border: 1px solid #ddd; background: #fff; border-radius: 8px;
  padding: 4px 10px; font-size: 1rem; line-height: 1.4; }
.modale-actions-entete button:hover { background: #f4f4fa; }
.fil { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 8px 16px;
  border-bottom: 1px solid #eee; font-size: 0.9em; }
.fil button { border: none; background: none; color: var(--violet); font-weight: 600;
  padding: 2px 4px; border-radius: 6px; font-size: inherit; }
.fil button:hover { background: #efeffc; }
.fil .sep { color: #999; }
.fil .courant { color: #555; font-weight: 400; }
.modale-statut { padding: 6px 16px; font-size: 0.85em; color: #555; min-height: 1.4em; }
.modale-statut.erreur { color: #a31515; }
.modale-liste { overflow: auto; padding: 4px 8px 8px; min-height: 180px; max-height: 44vh; }
.entree { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px;
  font-size: 0.95em; }
    </style>
    <script type="importmap">
    {"imports": {
    "react": "https://esm.sh/react@19.1.0",
    "react-dom": "https://esm.sh/react-dom@19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.1.0/jsx-runtime",
    "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom"
    }}
    </script>
    </head>
    <body>
    <div id="scene" aria-label="Éditeur Excalidraw"></div>
    <div id="puce" role="status" title="Fichier courant">Nouveau dessin</div>
    <div id="repli">
    <p>Éditeur indisponible (CDN injoignable). Repli : collez un document
    Excalidraw JSON ci-dessous, puis sauvegardez vers la bibliothèque.</p>
    <textarea id="json" spellcheck="false" aria-label="Document Excalidraw au format JSON"></textarea>
    <div><button id="btn-repli-charger">Charger JSON</button>
    <button id="btn-repli-enregistrer">Sauvegarder (JSON)</button></div>
    </div>
    <div id="voile" class="voile" hidden>
      <div id="modale" class="ile" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
        <div class="modale-entete">
          <h2 id="modale-titre">Ouvrir un dessin</h2>
          <div class="modale-actions-entete">
            <button id="btn-parent" title="Dossier parent">↑</button>
            <button id="btn-actualiser" title="Actualiser la liste">↻</button>
            <button id="btn-fermer" title="Fermer (Échap)">✕</button>
          </div>
        </div>
        <nav id="fil" class="fil" aria-label="Fil d'Ariane"></nav>
        <div id="modale-statut" class="modale-statut" role="status"></div>
        <div id="modale-liste" class="modale-liste" role="listbox" aria-label="Dossiers et dessins"></div>
        <div id="zone-nom" class="zone-nom" hidden>
          <label for="nom-fichier">Nom de fichier</label>
          <input id="nom-fichier" type="text" autocomplete="off" spellcheck="false"
            placeholder="sans-titre.excalidraw" aria-describedby="dossier-courant">
          <div class="dossier-courant">Dossier : <b id="dossier-courant">Excalidraw/</b></div>
        </div>
        <div class="modale-pied">
          <span id="modale-selection" class="modale-selection"></span>
          <button id="btn-modale-annuler">Annuler</button>
          <button id="btn-modale-ouvrir" class="action">Ouvrir</button>
          <button id="btn-modale-enregistrer" class="action" hidden>Enregistrer</button>
        </div>
      </div>
    </div>
    <script type="module">
    const $ = (id) => document.getElementById(id);
  // Chemin privé de confiance : le navigateur n'envoie AUCUN secret.
  // Le proxy nginx du vhost privé injecte côté serveur l'identifiant
  // avant de relayer vers la passerelle 127.0.0.1:8123.
    const api = async (methode, chemin, corps) => {
      const r = await fetch("api/" + chemin, { method: methode,
        headers: { "Content-Type": "application/json" },
        body: corps === undefined ? undefined : JSON.stringify(corps) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) throw new Error(d.erreur || ("HTTP " + r.status));
      return d;
    };
    const apiBrut = async (methode, chemin, texte) => {
      const r = await fetch("api/" + chemin, { method: methode,
        headers: { "Content-Type": "application/json" },
        body: texte });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) throw new Error(d.erreur || ("HTTP " + r.status));
      return d;
    };
    let dossier = "";
    let fichierSel = null;   // chemin relatif distant
    let docCourant = null;
    let excaliAPI = null;
    let editeurPret = false;
    let modeModale = null;   // "ouvrir" | "enregistrer" | null
    let dernierFocus = null;
    let message = "";
    
    const nomFichier = (rel) => (rel || "dessin").split("/").pop();
    const dossierParent = (rel) => (rel && rel.includes("/")) ? rel.slice(0, rel.lastIndexOf("/")) : "";
    const rafraichirPuce = () => {
      const base = fichierSel ? "Excalidraw/" + fichierSel : "Nouveau dessin";
      $("puce").textContent = message ? base + " — " + message : base;
      $("puce").title = $("puce").textContent;
      document.title = (fichierSel ? nomFichier(fichierSel) + " — " : "") + "Excalidraw";
    };
    const msg = (t) => { message = t || ""; rafraichirPuce(); };
    const statut = (t) => { message = t || ""; rafraichirPuce(); };
    const statutModale = (t, erreur) => {
      const el = $("modale-statut");
      el.textContent = t;
      el.classList.toggle("erreur", !!erreur);
    };
    
    const SVG_DOSSIER = '<svg viewBox="0 0 24 24" fill="none" stroke="#6965db" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
    const SVG_FICHIER = '<svg viewBox="0 0 24 24" fill="none" stroke="#8a8aa3" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>'
      + '<path d="M14 2v6h6"/></svg>';
    
    function sceneVersDocument() {
      if (editeurPret && excaliAPI) {
        const elements = excaliAPI.getSceneElements();
        const appState = excaliAPI.getAppState();
        return { type: "excalidraw", version: 2,
          source: location.origin + location.pathname,
          elements: JSON.parse(JSON.stringify(elements)),
          appState: { viewBackgroundColor: appState.viewBackgroundColor }, files: {} };
      }
      return JSON.parse($("json").value || "null");
    }
    function documentVersScene(doc) {
      docCourant = doc;
      $("json").value = JSON.stringify(doc, null, 2);
      if (editeurPret && excaliAPI) {
        excaliAPI.updateScene({ elements: doc.elements || [], appState: doc.appState || {} });
      }
    }
    function rendreFil() {
      const fil = $("fil");
      fil.innerHTML = "";
      const racine = document.createElement("button");
      racine.type = "button";
      racine.textContent = "Excalidraw";
      racine.title = "Racine Excalidraw";
      racine.setAttribute("aria-label", "Aller à la racine Excalidraw");
      racine.onclick = () => { dossier = ""; rafraichirModale().catch(() => {}); };
      fil.appendChild(racine);
      if (dossier) {
        const segs = dossier.split("/");
        let cumul = "";
        segs.forEach((s, i) => {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "/";
          fil.appendChild(sep);
          cumul = cumul ? cumul + "/" + s : s;
          const ici = cumul;
          const dernier = i === segs.length - 1;
          if (dernier) {
            const b = document.createElement("span");
            b.className = "courant";
            b.textContent = s;
            fil.appendChild(b);
          } else {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = s;
            b.setAttribute("aria-label", "Aller au dossier " + ici);
            b.onclick = () => { dossier = ici; rafraichirModale().catch(() => {}); };
            fil.appendChild(b);
          }
        });
      }
    }
    function majPiedModale() {
      const sel = $("modale-selection");
      if (modeModale === "enregistrer") {
        $("dossier-courant").textContent = "Excalidraw/" + (dossier ? dossier + "/" : "");
        const nom = $("nom-fichier").value.trim() || "…";
        sel.textContent = "Enregistrera : Excalidraw/" + (dossier ? dossier + "/" : "") + nom;
      } else {
        sel.textContent = fichierSel ? "Sélection : Excalidraw/" + fichierSel : "Aucune sélection";
        $("btn-modale-ouvrir").disabled = !fichierSel;
      }
    }
    function selectionnerFichier(chemin) {
      fichierSel = chemin;
      for (const b of $("modale-liste").querySelectorAll(".entree.fichier")) {
        b.setAttribute("aria-selected", b.dataset.chemin === chemin ? "true" : "false");
      }
      majPiedModale();
    }
    async function rafraichirModale() {
      rendreFil();
      majPiedModale();
      const liste = $("modale-liste");
      liste.innerHTML = "";
      liste.setAttribute("aria-busy", "true");
      statutModale("Chargement…", false);
      let vue;
      try {
        vue = await api("GET", "liste?chemin=" + encodeURIComponent(dossier));
      } catch (e) {
        liste.removeAttribute("aria-busy");
        statutModale("Erreur : " + e.message, true);
        const p = document.createElement("p");
        p.className = "vide";
        p.textContent = "Impossible de lister ce dossier. Actualisez (↻) ou réessayez.";
        liste.appendChild(p);
        msg("erreur de liste");
        return;
      }
      liste.removeAttribute("aria-busy");
      for (const d of vue.dossiers) {
        const chemin = dossier ? dossier + "/" + d : d;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "entree dossier";
        b.setAttribute("role", "option");
        b.setAttribute("aria-selected", "false");
        b.title = "Ouvrir le dossier " + d;
        b.setAttribute("aria-label", "Dossier " + d);
        b.innerHTML = SVG_DOSSIER + '<span class="nom"></span>';
        b.querySelector(".nom").textContent = d;
        b.onclick = () => { dossier = chemin; rafraichirModale().catch(() => {}); };
        liste.appendChild(b);
      }
      for (const f of vue.fichiers) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "entree fichier";
        b.setAttribute("role", "option");
        b.setAttribute("aria-selected", f.chemin === fichierSel ? "true" : "false");
        b.dataset.chemin = f.chemin;
        b.title = f.chemin;
        b.setAttribute("aria-label", "Dessin " + f.nom);
        b.innerHTML = SVG_FICHIER + '<span class="nom"></span>';
        b.querySelector(".nom").textContent = f.nom;
        b.onclick = () => selectionnerFichier(f.chemin);
        b.ondblclick = () => { selectionnerFichier(f.chemin); validerModale().catch(() => {}); };
        liste.appendChild(b);
      }
      if (!vue.dossiers.length && !vue.fichiers.length) {
        const p = document.createElement("p");
        p.className = "vide";
        p.textContent = modeModale === "enregistrer"
          ? "Dossier vide : choisissez un nom de fichier ci-dessous puis Enregistrer."
          : "Dossier vide : aucun dessin ici. Remontez (↑) ou changez de dossier.";
        liste.appendChild(p);
      }
      statutModale(vue.dossiers.length + " dossier(s), " + vue.fichiers.length + " dessin(s)", false);
      msg(vue.dossiers.length + " dossiers, " + vue.fichiers.length + " dessins");
    }
    function ouvrirModale(mode) {
      modeModale = mode;
      dernierFocus = document.activeElement;
      const estSave = mode === "enregistrer";
      $("modale-titre").textContent = estSave ? "Sauvegarder un dessin" : "Ouvrir un dessin";
      $("modale-liste").setAttribute("aria-label", estSave
        ? "Choisir le dossier de destination"
        : "Dossiers et dessins");
      $("btn-modale-ouvrir").hidden = estSave;
      $("btn-modale-enregistrer").hidden = !estSave;
      $("zone-nom").hidden = !estSave;
      if (estSave) {
        if (!dossier && fichierSel) dossier = dossierParent(fichierSel);
        $("nom-fichier").value = fichierSel ? nomFichier(fichierSel) : "sans-titre.excalidraw";
      }
      $("voile").hidden = false;
      rafraichirModale().catch(() => {});
      (estSave ? $("nom-fichier") : $("btn-modale-ouvrir")).focus();
    }
    function fermerModale() {
      $("voile").hidden = true;
      modeModale = null;
      if (dernierFocus && dernierFocus.focus) dernierFocus.focus();
    }
    async function ouvrirDistant() {
      if (!fichierSel) { msg("sélectionnez un fichier"); return; }
      const d = await api("GET", "document?chemin=" + encodeURIComponent(fichierSel));
      documentVersScene(d.document);
      rafraichirPuce();
      msg("ouvert : Excalidraw/" + fichierSel);
      if (location.hash !== "#/" + fichierSel) history.replaceState(null, "", "#/" + fichierSel);
    }
    async function sauvegarderDistantCible(cible) {
      let doc;
      try { doc = sceneVersDocument(); }
      catch { msg("JSON invalide"); statutModale("JSON invalide : rien à sauvegarder.", true); return; }
      if (!doc || doc.type !== "excalidraw" || !Array.isArray(doc.elements)) {
        msg("rien à sauvegarder");
        statutModale("Rien à sauvegarder : le dessin est vide ou invalide.", true);
        return;
      }
      await apiBrut("PUT", "document?chemin=" + encodeURIComponent(cible), JSON.stringify(doc));
      fichierSel = cible; docCourant = doc;
      rafraichirPuce();
      msg("sauvegardé : Excalidraw/" + cible);
      if (location.hash !== "#/" + cible) history.replaceState(null, "", "#/" + cible);
    }
    function normaliserNomSauvegarde(brut) {
      let nom = (brut || "").trim().replace(/\\/g, "/").trim();
      if (!nom) throw new Error("nom de fichier requis");
      if (nom.startsWith("/") || nom.startsWith("./") || nom.includes("..")) {
        throw new Error("nom simple attendu (sans chemin) : choisissez le dossier via la liste");
      }
      nom = nom.split("/").filter((s) => s && s !== ".").join("/");
      if (!nom) throw new Error("nom de fichier requis");
      if (!nom.toLowerCase().endsWith(".excalidraw")) nom += ".excalidraw";
      return nom;
    }
    async function validerModale() {
      if (modeModale === "ouvrir") {
        if (!fichierSel) { statutModale("Sélectionnez un dessin à ouvrir.", true); return; }
        try {
          await ouvrirDistant();
          fermerModale();
        } catch (e) { statutModale("Erreur : " + e.message, true); }
      } else if (modeModale === "enregistrer") {
        let nom;
        try { nom = normaliserNomSauvegarde($("nom-fichier").value); }
        catch (e) { statutModale("Erreur : " + e.message, true); return; }
        const cible = dossier ? dossier + "/" + nom : nom;
        try {
          await sauvegarderDistantCible(cible);
          fermerModale();
        } catch (e) { statutModale("Erreur : " + e.message, true); }
      }
    }
    function nouveauDessin() {
      fichierSel = null; docCourant = null;
      if (editeurPret && excaliAPI) excaliAPI.updateScene({ elements: [] });
      $("json").value = ""; history.replaceState(null, "", location.pathname);
      rafraichirPuce();
      msg("nouveau dessin");
    }
    async function demarrer() {
      $("btn-repli-charger").onclick = () => {
        try { documentVersScene(JSON.parse($("json").value)); msg("JSON chargé"); }
        catch { msg("JSON invalide"); }
      };
      $("btn-repli-enregistrer").onclick = () => ouvrirModale("enregistrer");
      // --- Modale : fermeture, navigation, clavier ---
      $("btn-fermer").onclick = () => fermerModale();
      $("btn-modale-annuler").onclick = () => fermerModale();
      $("btn-parent").onclick = () => {
        dossier = dossier.includes("/") ? dossier.slice(0, dossier.lastIndexOf("/")) : "";
        rafraichirModale().catch(() => {});
      };
      $("btn-actualiser").onclick = () => rafraichirModale().catch(() => {});
      $("btn-modale-ouvrir").onclick = () => validerModale().catch(() => {});
      $("btn-modale-enregistrer").onclick = () => validerModale().catch(() => {});
      $("nom-fichier").addEventListener("input", () => majPiedModale());
      $("nom-fichier").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); validerModale().catch(() => {}); }
      });
      $("voile").addEventListener("mousedown", (ev) => {
        if (ev.target === $("voile")) fermerModale();
      });
      document.addEventListener("keydown", (ev) => {
        if ($("voile").hidden) return;
        if (ev.key === "Escape") { ev.preventDefault(); fermerModale(); return; }
        if (ev.key === "Tab") {
          const focusables = [...$("modale").querySelectorAll("button, input")]
            .filter((el) => !el.disabled && el.offsetParent !== null);
          if (!focusables.length) return;
          const premier = focusables[0];
          const dernier = focusables[focusables.length - 1];
          if (ev.shiftKey && document.activeElement === premier) {
            ev.preventDefault(); dernier.focus();
          } else if (!ev.shiftKey && document.activeElement === dernier) {
            ev.preventDefault(); premier.focus();
          }
          return;
        }
        if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && modeModale) {
          const entrees = [...$("modale-liste").querySelectorAll(".entree")];
          if (!entrees.length) return;
          const i = entrees.indexOf(document.activeElement);
          ev.preventDefault();
          const suivant = ev.key === "ArrowDown"
            ? entrees[(i + 1 + entrees.length) % entrees.length]
            : entrees[(i - 1 + entrees.length) % entrees.length];
          suivant.focus();
        }
      });
      // Deep-link « ouvrir dans Excalidraw » : #/chemin/vers.excalidraw.
      // Aucune auth côté navigateur : le proxy privé injecte le secret serveur.
      if (location.hash.startsWith("#/")) {
        fichierSel = decodeURIComponent(location.hash.slice(2));
        dossier = dossierParent(fichierSel);
        rafraichirPuce();
        msg("ouverture de Excalidraw/" + fichierSel + "…");
      } else {
        rafraichirPuce();
      }
      try {
        const React = await import("react");
        const { createRoot } = await import("react-dom/client");
        const { Excalidraw } = await import("@excalidraw/excalidraw");
        const h = React.createElement;
        // Actions bibliothèque discrètes, intégrées au canvas officiel
        // (même pattern que l'app upstream : renderTopRightUI).
        const ActionsBiblio = () => h("div", { className: "biblio-groupe" },
          h("button", { type: "button", className: "biblio-btn", title: "Ouvrir un dessin de la bibliothèque",
            onClick: () => ouvrirModale("ouvrir") }, "Ouvrir"),
          h("button", { type: "button", className: "biblio-btn biblio-btn-primaire",
            title: "Sauvegarder le dessin courant dans la bibliothèque",
            onClick: () => ouvrirModale("enregistrer") }, "Enregistrer"),
          h("button", { type: "button", className: "biblio-btn", title: "Repartir d'un dessin vide",
            onClick: () => nouveauDessin() }, "Nouveau"));
        const App = () => h("div", { className: "excalidraw-wrapper", style: { height: "100%" } },
          h(Excalidraw, { excalidrawAPI: (api2) => { excaliAPI = api2; },
            theme: "light",
            renderTopRightUI: () => h(ActionsBiblio, null),
            initialData: docCourant ? { elements: docCourant.elements, appState: docCourant.appState } : null }));
        createRoot($("scene")).render(h(App));
        editeurPret = true;
        if (fichierSel) {
          ouvrirDistant().catch((e) => {
            msg("deep-link : " + e.message);
            ouvrirModale("ouvrir");
          });
        }
      } catch (e) {
        $("scene").style.display = "none";
        $("repli").style.display = "flex";
        msg("éditeur indisponible, repli JSON actif");
      }
    }
    demarrer();
    </script>
    </body>
    </html>
